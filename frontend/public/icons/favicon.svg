<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="CyberShild logo">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7dc85"/><stop offset=".5" stop-color="#d4a62a"/><stop offset="1" stop-color="#a97c12"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14305f"/><stop offset="1" stop-color="#0a1b3d"/>
    </linearGradient>
    <linearGradient id="saf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e8610a"/><stop offset="1" stop-color="#ffa43a"/>
    </linearGradient>
  </defs>
  <!-- outer gold shield -->
  <path d="M100 6 L172 28 V100 C172 154 140 190 100 212 C60 190 28 154 28 100 V28 Z" fill="url(#gold)"/>
  <!-- inner navy shield -->
  <path d="M100 17 L162 36 V100 C162 148 134 180 100 199 C66 180 38 148 38 100 V36 Z" fill="url(#navy)"/>
  <path d="M100 25 L154 41 V100 C154 143 130 172 100 189 C70 172 46 143 46 100 V41 Z" fill="none" stroke="#d4a62a" stroke-width="1.5" opacity=".7"/>
  <!-- lotus (saffron petals) -->
  <g transform="translate(100 150)">
    <path d="M0 0 C-14 -10 -16 -28 0 -42 C16 -28 14 -10 0 0Z" fill="url(#saf)"/>
    <path d="M-4 2 C-24 -2 -34 -18 -30 -34 C-14 -30 -4 -16 -4 2Z" fill="#f47a1f" opacity=".95"/>
    <path d="M4 2 C24 -2 34 -18 30 -34 C14 -30 4 -16 4 2Z" fill="#f47a1f" opacity=".95"/>
    <path d="M-8 4 C-34 8 -48 -4 -50 -18 C-32 -20 -14 -12 -8 4Z" fill="#ffb347" opacity=".9"/>
    <path d="M8 4 C34 8 48 -4 50 -18 C32 -20 14 -12 8 4Z" fill="#ffb347" opacity=".9"/>
  </g>
  <!-- padlock -->
  <rect x="78" y="76" width="44" height="36" rx="6" fill="url(#gold)"/>
  <path d="M86 76 V66 a14 14 0 0 1 28 0 V76" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="100" cy="92" r="5" fill="#0a1b3d"/><rect x="98" y="94" width="4" height="10" rx="2" fill="#0a1b3d"/>
  <!-- green accent arc -->
  <path d="M52 62 C52 62 56 120 100 168" fill="none" stroke="#138808" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  <path d="M148 62 C148 62 144 120 100 168" fill="none" stroke="#138808" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  <!-- top finial -->
  <circle cx="100" cy="30" r="3.5" fill="#ffb347"/>
</svg>
